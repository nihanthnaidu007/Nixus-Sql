# Packaging metadata — added in Phase 7.1 for ONE reason: to register the `nixus`
# console-script entry point so `nixus query "..."` works after install.
#
# Runtime dependencies are intentionally NOT declared here. They are managed by
# requirements.txt / requirements.lock (both unchanged). Install the console
# script into an env that already has the requirements with:
#
#     pip install -e . --no-deps
#
# For dev use without installing, every command also runs via the module path:
#
#     python -m nixus.cli query "how many tracks are there?"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nixus"
version = "3.0.0"
description = "NIXUS — grounded natural-language SQL agent"
requires-python = ">=3.10"

[project.scripts]
nixus = "nixus.cli:main"

[tool.setuptools.packages.find]
include = ["nixus*"]

[tool.ruff]
# Pinned to ruff 0.16.x in requirements-dev.txt — its (much expanded) default
# ruleset is what CI enforces. BLE001 (blind except) and S110 (try-except-pass)
# conflict with this codebase's deliberate resilience pattern: broad
# except-with-fallback guards in graph nodes, the API, and the eval probes.
# Narrowing those handlers would change error semantics, which is out of
# Wave-0 scope; a dedicated resilience pass may revisit.
[tool.ruff.lint]
ignore = ["BLE001", "S110"]
