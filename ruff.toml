# Ruff configuration — Wave 2 trim.
#
# ruff 0.16.x's expanded default ruleset is the enforcement baseline; CI runs
# `ruff check .` pinned to the same version as requirements-dev.txt (0.16.8).
#
# Wave 1 temporarily relaxed several style families while the Wave 0 security
# pass was still in flight. Those are RE-ENFORCED now: I, DTZ, C4, ISC, LOG,
# UP, and FURB all pass clean on the merged tree, and the Wave 0 per-file
# F401/F841/F541 residuals are gone (the per-file-ignores section was dropped).
#
# What remains ignored is DELIBERATE, not temporary:
#   * PLW/PLR/PERF/SIM/RUF — broad polish families whose findings are
#     judgment calls (naming, complexity, micro-performance) rather than
#     correctness; revisit per-family, not wholesale.
#   * BLE001 (blind except) and S110 (try-except-pass) conflict with this
#     codebase's resilience pattern — broad except-with-fallback guards in
#     graph nodes, the API, and the eval probes. Narrowing those handlers
#     changes error semantics; a dedicated resilience pass may revisit.

[lint]
ignore = [
  "PLW",    # pylint warnings (e.g. subprocess call without shell=False)
  "PLR",    # pylint refactors
  "PERF",   # perflint
  "SIM",    # flake8-simplify
  "RUF",    # ruff-specific rules
  "BLE001", # blind except — deliberate resilience pattern (see header)
  "S110",   # try-except-pass — same resilience pattern (see header)
]

